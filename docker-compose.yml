# Terracraft : serveur Minecraft Java (Paper 26.3)
# Variables : WHITELIST, OPS, MEMORY, MOTD, TZ (voir README)
# SERVICE_PASSWORD_RCON est généré automatiquement au déploiement.

services:
  mc:
    build: .
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "25565:25565"       # Minecraft (TCP)
      - "24454:24454/udp"   # Simple Voice Chat (UDP)
    expose:
      - "8100"              # BlueMap (web), derrière reverse proxy
    environment:
      EULA: "TRUE"
      TZ: ${TZ:-UTC}

      # Moteur et version
      TYPE: PAPER
      VERSION: "26.3"
      # Paper 26.3 n'a que des builds BETA pour l'instant.
      # Quand une build STABLE sort, supprimer cette ligne.
      PAPER_CHANNEL: experimental

      # Performances
      MEMORY: ${MEMORY:-6G}
      USE_AIKAR_FLAGS: "true"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"

      # Gameplay
      MOTD: ${MOTD:-Terracraft}
      DIFFICULTY: normal
      MODE: survival
      MAX_PLAYERS: "10"
      SPAWN_PROTECTION: "0"
      ALLOW_FLIGHT: "TRUE"     # évite les kicks "flying is not enabled" en cas de lag (elytra, chevaux)

      # Accès
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST: ${WHITELIST}
      OPS: ${OPS}
      RCON_PASSWORD: ${SERVICE_PASSWORD_RCON}

      # Plugins (téléchargés automatiquement au démarrage)
      MODRINTH_PROJECTS: |
        luckperms
        bluemap
        simple-voice-chat
        chunky
      # EssentialsX : build dev compatible 26.3 (pas encore de release stable)
      PLUGINS: https://ci.ender.zone/job/EssentialsX/1830/artifact/jars/EssentialsX-2.22.1-dev%2B25-cfb6f12.jar
      PATCH_DEFINITIONS: /patches/patches.json

      # Commandes rejouées à chaque démarrage (idempotentes)
      # Groupe admin : tout sauf créatif, give (et équivalents) et escalade de droits
      RCON_CMDS_STARTUP: |-
        gamerule players_sleeping_percentage 50
        lp group default permission set essentials.home true
        lp group default permission set essentials.sethome true
        lp group default permission set essentials.sethome.multiple true
        lp group default permission set essentials.delhome true
        lp group default permission set essentials.renamehome true
        lp group default permission set essentials.tpa true
        lp group default permission set essentials.tpahere true
        lp group default permission set essentials.tpaccept true
        lp group default permission set essentials.tpdeny true
        lp group default permission set essentials.tpacancel true
        lp group default permission set essentials.back true
        lp creategroup admin
        lp group admin permission set * true
        lp group admin permission set luckperms.* false
        lp group admin permission set minecraft.command.op false
        lp group admin permission set minecraft.command.deop false
        lp group admin permission set essentials.sudo false
        lp group admin permission set minecraft.command.execute false
        lp group admin permission set minecraft.command.gamemode false
        lp group admin permission set minecraft.command.defaultgamemode false
        lp group admin permission set essentials.gamemode.all false
        lp group admin permission set essentials.gamemode.creative false
        lp group admin permission set minecraft.command.give false
        lp group admin permission set minecraft.command.item false
        lp group admin permission set minecraft.command.loot false
        lp group admin permission set minecraft.command.summon false
        lp group admin permission set minecraft.command.setblock false
        lp group admin permission set minecraft.command.fill false
        lp group admin permission set minecraft.command.clone false
        lp group admin permission set minecraft.command.place false
        lp group admin permission set minecraft.command.data false
        lp group admin permission set essentials.give false
        lp group admin permission set essentials.item false
        lp group admin permission set essentials.more false
        lp group admin permission set essentials.kit false
        lp group admin permission set essentials.skull false
        lp group admin permission set essentials.spawnmob false
        lp group admin permission set essentials.spawner false
    volumes:
      - mc-data:/data

  backups:
    image: itzg/mc-backup
    restart: unless-stopped
    depends_on:
      - mc
    environment:
      TZ: ${TZ:-UTC}
      RCON_HOST: mc
      RCON_PASSWORD: ${SERVICE_PASSWORD_RCON}
      INITIAL_DELAY: 15m
      BACKUP_INTERVAL: 12h
      PRUNE_BACKUPS_DAYS: "5"
      PAUSE_IF_NO_PLAYERS: "true"
      TAR_COMPRESS_METHOD: zstd
      EXCLUDES: "*.jar,cache,logs,*.tmp,bluemap,libraries,versions"
    volumes:
      - mc-data:/data:ro
      - mc-backups:/backups

volumes:
  mc-data:
  mc-backups:
